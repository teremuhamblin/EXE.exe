name: CodeQL — Analyse de sécurité

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "30 6 * * 1" # Analyse automatique chaque lundi à 06h30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyse CodeQL (C# & Actions)
    runs-on: windows-latest

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v7

      - name: 🔍 Initialisation de CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp, actions

      - name: 🛠️ Compilation tracée pour CodeQL (build.bat)
        shell: cmd
        run: |
          call build.bat
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: 🛡️ Exécution de l'analyse CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp-actions"
