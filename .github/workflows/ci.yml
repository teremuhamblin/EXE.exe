name: CI — Build EXE.exe

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation Windows (.NET Framework 4.x / csc.exe)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ajout de csc.exe au PATH
        shell: pwsh
        run: |
          $cscDir = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319"
          if (Test-Path "$cscDir\csc.exe") {
            $cscDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "csc.exe introuvable dans $cscDir"
            exit 1
          }

      - name: Compilation via build.bat
        shell: cmd
        run: |
          call build.bat
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Vérification du binaire et calcul SHA-256
        shell: pwsh
        run: |
          $filePath = ".\EXE.exe"
          if (-not (Test-Path $filePath)) { throw "EXE.exe n'a pas été généré." }
          $file = Get-Item $filePath
          if ($file.Length -eq 0) { throw "EXE.exe est vide." }
          $assembly = [System.Reflection.AssemblyName]::GetAssemblyName($file.FullName)
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          "$hash  EXE.exe" | Out-File -FilePath ".\EXE.exe.sha256" -Encoding ascii
          @(
            '### Build EXE.exe réussi',
            '| Propriété | Valeur |',
            '| :--- | :--- |',
            '| Fichier | `EXE.exe` |',
            "| Taille | $($file.Length) octets |",
            ('| Assembly | `{0}` |' -f $assembly.FullName),
            ('| SHA-256 | `{0}` |' -f $hash)
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Sauvegarde de l'artefact
        uses: actions/upload-artifact@v7
        with:
          name: EXE-Windows-Build
          path: |
            EXE.exe
            EXE.exe.sha256
          if-no-files-found: error
          retention-days: 30
