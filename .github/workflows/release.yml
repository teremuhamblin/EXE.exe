name: Release — Publication automatique EXE.exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publication de la release
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du code au tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ajout de csc.exe au PATH
        shell: pwsh
        run: |
          $cscDir = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319"
          if (-not (Test-Path "$cscDir\csc.exe")) { throw "csc.exe introuvable dans $cscDir" }
          $cscDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compilation
        shell: cmd
        run: |
          call build.bat
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Vérification et checksum SHA-256
        shell: pwsh
        run: |
          $file = Get-Item ".\EXE.exe" -ErrorAction Stop
          if ($file.Length -eq 0) { throw "EXE.exe est vide." }
          [System.Reflection.AssemblyName]::GetAssemblyName($file.FullName) | Out-Null
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          "$hash  EXE.exe" | Out-File -FilePath ".\EXE.exe.sha256" -Encoding ascii

      - name: Création ou mise à jour de la GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag .\EXE.exe .\EXE.exe.sha256 --clobber
          } else {
            gh release create $tag .\EXE.exe .\EXE.exe.sha256 `
              --title "EXE.exe $tag — Encrypted_X-Environnement" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "La publication de la release a échoué." }
